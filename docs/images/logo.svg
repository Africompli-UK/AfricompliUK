<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80" role="img" aria-label="AfriCompli UK logo">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1A6B4A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D4A32;stop-opacity:1" />
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="40" cy="40" r="34" />
    </clipPath>
  </defs>

  <!-- Badge circle background -->
  <circle cx="40" cy="40" r="36" fill="#0A0A0A" />
  <circle cx="40" cy="40" r="34" fill="url(#badgeGrad)" />

  <!-- Gold ring -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#C8A96E" stroke-width="1.5" />

  <!-- Simplified African continent shape (abstract) -->
  <g clip-path="url(#circleClip)" opacity="0.25">
    <path d="M38 12 C32 14 26 20 24 28 C22 34 24 38 22 44 C20 50 22 56 28 60 C34 64 38 62 42 64 C46 66 50 62 52 56 C54 50 52 44 54 38 C56 30 52 22 46 16 C44 13 41 11 38 12 Z" fill="#C8A96E" />
  </g>

  <!-- UK flag cross (simplified, subtle) -->
  <g clip-path="url(#circleClip)" opacity="0.18">
    <line x1="6" y1="40" x2="74" y2="40" stroke="#F5F2EC" stroke-width="6" />
    <line x1="40" y1="6" x2="40" y2="74" stroke="#F5F2EC" stroke-width="6" />
  </g>

  <!-- AC monogram -->
  <text x="40" y="47" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#C8A96E" text-anchor="middle" letter-spacing="1">AC</text>

  <!-- Wordmark: Afri -->
  <text x="88" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#F5F2EC" letter-spacing="0.5">Afri</text>
  <!-- Wordmark: Compli -->
  <text x="88" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="none">
    <tspan fill="#F5F2EC">Afri</tspan>
  </text>
  <text x="130" y="36" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" fill="#C8A96E" letter-spacing="0.5">Compli</text>
  <!-- Wordmark: UK -->
  <text x="236" y="36" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#C8A96E" letter-spacing="3">UK</text>

  <!-- Tagline -->
  <text x="88" y="56" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" fill="#F5F2EC" opacity="0.5" letter-spacing="2">COMPLIANCE SIMPLIFIED</text>
</svg>
